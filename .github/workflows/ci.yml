name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    # Pulse targets macOS 26 with the Swift 6.2 toolchain, and `swift test` *runs*
    # the suite, so it needs a macOS 26 runner (the test binary won't launch on an
    # older OS). If your org doesn't have the `macos-26` image yet, this job waits
    # for a matching runner — bump the label once GitHub publishes it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version
          xcodebuild -version || true

      - name: Build
        run: swift build

      - name: Test
        # DIAGNOSTIC ONLY, not a permanent choice: the suite crashes in CI with
        # SIGTRAP (signal 5) and swift-testing's default parallel execution
        # means every test's `◇ started` line prints with zero `✔/✘` results,
        # so the crashing test cannot be named from the log. --no-parallel makes
        # the LAST started line the crashing test. Revert to parallel once the
        # culprit is found and fixed.
        run: swift test --no-parallel

      - name: Dump crash report on test failure
        if: failure()
        run: |
          dir=~/Library/Logs/DiagnosticReports
          echo "--- ls -la $dir ---"
          ls -la "$dir" 2>&1 || echo "(no such directory)"
          echo "--- PulsePackageTests* reports ---"
          for f in "$dir"/PulsePackageTests*; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              cat "$f"
            fi
          done

      # Source-level guards for defects that compile and pass tests: a UI
      # surface bypassing the gauge-direction setting, a Spacer that stops the
      # panel shrinking, a per-tick animation that redraws at display rate.
      - name: Guards
        run: |
          python3 scripts/check-gauge-direction.py
          python3 scripts/check-panel-height.py
          python3 scripts/check-timeline-animation.py

      # Planted-defect verifier for 429 / Retry-After handling. Gated here
      # because the failure it guards is silent: the app keeps working, keeps
      # showing carried-forward numbers, and keeps renewing its own rate limit.
      - name: Rate-limit backoff verifier
        run: bash scripts/verify-rate-limit-backoff.sh
