name: Release

# Builds, Developer ID-signs, notarizes, and staples Byte Pulse, then attaches the
# notarized dist/Byte-Pulse.dmg to the GitHub release for the pushed tag. The
# website's download CTA points at releases/latest/download/Byte-Pulse.dmg, so the
# asset name must stay exactly "Byte-Pulse.dmg" (build-app.sh keeps it stable).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEVID_CERT_P12_BASE64   base64 of the "Developer ID Application" cert+key .p12
#                             export from Keychain Access, then: base64 -i cert.p12 | pbcopy
#   DEVID_CERT_PASSWORD     password protecting that .p12
#   ASC_API_KEY_P8_BASE64   base64 of the App Store Connect API key .p8
#                             base64 -i AuthKey_XXXX.p8 | pbcopy
#   ASC_KEY_ID              the key's Key ID
#   ASC_ISSUER_ID           the API key Issuer ID (App Store Connect → Integrations → Keys)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the DMG to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write   # create releases and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, publish
    runs-on: macos-26
    env:
      NOTARY_PROFILE: BYTE_NOTARY
      # Optional: a Vercel deploy hook for pulse.byte.de. The website bakes this
      # repo's CHANGELOG.md into its /changelog/ page at build time, so a
      # redeploy after each release publishes the new notes right away.
      # Create it in Vercel → Project → Settings → Git → Deploy Hooks and store
      # the URL as the VERCEL_DEPLOY_HOOK_URL secret; the step is skipped until then.
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version
          xcrun notarytool --version

      - name: Import Developer ID certificate into a temporary keychain
        env:
          CERT_B64: ${{ secrets.DEVID_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.DEVID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          printf '%s' "$CERT_B64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"   # no auto-lock mid-build
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PW" -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          # Allow codesign to use the key without an interactive UI prompt (impossible in CI).
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KEYCHAIN" >/dev/null
          # Put our keychain first on the search list so codesign finds the identity.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_PATH"

          # Derive the exact identity string the cert provides (avoids a brittle secret).
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"$/\1/')"
          [ -n "$IDENTITY" ] || { echo "::error::No 'Developer ID Application' identity found in the imported cert"; exit 1; }
          echo "Using signing identity: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Register notarytool credentials (App Store Connect API key)
        env:
          KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_B64" | base64 --decode -o "$KEY_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER"
          rm -f "$KEY_PATH"

      - name: Build, sign, notarize, staple
        run: ./scripts/build-app.sh --notarize

      - name: Final Gatekeeper assessment
        run: |
          set -euo pipefail
          spctl -a -vvv -t install dist/Byte-Pulse.dmg
          xcrun stapler validate dist/Byte-Pulse.dmg
          shasum -a 256 dist/Byte-Pulse.dmg

      - name: Attach notarized DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Create the release if it doesn't exist yet, otherwise just (re)upload the asset.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Byte-Pulse.dmg --clobber
          else
            gh release create "$TAG" dist/Byte-Pulse.dmg \
              --title "Byte Pulse ${TAG#v}" \
              --notes "Signed & notarized build. See CHANGELOG.md for details."
          fi

      - name: Redeploy pulse.byte.de so its changelog page picks up this release
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          set -euo pipefail
          # Tolerate a pasted trailing newline; insist on a Vercel hook URL so a
          # wrong clipboard surfaces here instead of as a silent non-deploy.
          HOOK="$(printf '%s' "$VERCEL_DEPLOY_HOOK_URL" | tr -d '[:space:]')"
          case "$HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *)
              echo "::error::VERCEL_DEPLOY_HOOK_URL is not a Vercel deploy-hook URL (expected https://api.vercel.com/v1/integrations/deploy/…) — the website was not redeployed."
              exit 1
              ;;
          esac
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Website redeploy triggered"
